function rnd(){ const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296; }
function pickRarity(){
  const tot = Object.values(RAR).reduce((s,r)=>s+r.w,0);
  let x = rnd()*tot;
  for (const k in RAR){ x -= RAR[k].w; if (x < 0) return k; }
  return 'milspec';
}
function roll(cid){
  const r = pickRarity();
  const pool = CASES[cid].items.map((it,i)=>({it,i})).filter(o=>o.it[1]===r);
  const o = pool[Math.floor(rnd()*pool.length)];
  return cid + ':' + o.i;
}
function itemOf(key){
  const [cid,i] = key.split(':'); const it = CASES[cid].items[+i];
  return {key, cid, name:it[0], rar:it[1], price:it[2]};
}

function spin(cid, win){
  return new Promise(resolve=>{
    const strip=$('strip'), box=$('reel'), N=44, WIN=36, pitch=104;
    const cells=[]; for(let i=0;i<N;i++) cells.push(i===WIN ? win : itemOf(roll(cid)));
    strip.style.transition='none'; strip.style.transform='translateX(0)';
    strip.innerHTML = cells.map(cellHTML).join('');
    void strip.offsetWidth;
    const target = WIN*pitch + 48 - box.clientWidth/2 + (rnd()-0.5)*60;
    strip.style.transition='transform 5.2s cubic-bezier(.08,.6,.12,1)';
    strip.style.transform=`translateX(${-target}px)`;
    let done=false; const stop=tickLoop(strip,m=>Math.floor((-m.m41+box.clientWidth/2)/104)); const fin=()=>{ if(!done){ done=true; stop(); resolve(); } };
    strip.addEventListener('transitionend',fin,{once:true});
    setTimeout(fin,5600);
  });
}

  <div class="stat"><span>Ставишь</span><b>${A?A.name+' · '+fmt(A.price)+' ◈':'—'}</b></div><div class="stat"><span>Хочешь получить</span><b>${B?B.name+' · '+fmt(B.price)+' ◈':'—'}</b></div>
  <button class="btn good" id="upgo" style="margin-top:14px" ${A&&B?'':'disabled'}>Апгрейд</button></div>
  <div class="card"><b style="display:block;margin-bottom:12px;font-size:14px">2. Цель</b>${A?`<div class="chips">${UPR.map((r,i)=>`<button class="chip${i===upR?' on':''}" data-r="${i}">×${r[0]}–${r[1]}</button>`).join('')}</div><div class="upl col">${tg.length?tg.map(o=>`<button class="upi row2${o.key===upTgt?' on':''}" data-t="${o.key}" style="--c:${RAR[o.rar].c}"><span class="th">${skinArt(o)}</span><span class="n">${o.name}<br><span class="muted">${CASES[o.cid].name} · ${fmt(o.price)} ◈</span></span><b>${(upChance(A,o)*100).toFixed(upChance(A,o)<.1?2:1)}%</b></button>`).join(''):'<p class="muted">В этом диапазоне целей нет. Выбери другой.</p>'}</div>`:'<p class="muted">Сначала выбери свой скин.</p>'}</div>`;
  document.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{if(busy)return;upSrc=b.dataset.src;upTgt=null;renderUp()});
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{if(busy)return;upTgt=b.dataset.t;renderUp();window.scrollTo({top:0,behavior:'smooth'})});
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(busy)return;upR=+b.dataset.r;upTgt=null;renderUp()});
  if($('upgo'))$('upgo').onclick=doUp;
}
async function doUp(){
  if(busy||!upSrc||!upTgt||!S.inv[upSrc])return;
  const A=itemOf(upSrc),B=itemOf(upTgt),ch=upChance(A,B),win=rnd()<ch,span=ch*360,m=.04;
  busy=true;$('upgo').disabled=true;sfx.start();
  S.inv[upSrc]--;if(!S.inv[upSrc])delete S.inv[upSrc];
  if(win)S.inv[upTgt]=(S.inv[upTgt]||0)+1;
  save();
  const th=win?span*(m+rnd()*(1-2*m)):span+(360-span)*(m+rnd()*(1-2*m)),p=$('ptr'),still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  p.style.transition='none';p.style.transform='rotate(0deg)';void p.offsetWidth;
  p.style.transition=still?'none':'transform 5s cubic-bezier(.08,.6,.12,1)';p.style.transform=`rotate(${1800+th}deg)`;
  const stop=still?()=>{}:tickLoop(p,m=>Math.floor(Math.atan2(m.b,m.a)*180/Math.PI/12));
  if(!still)await new Promise(r=>{let d=0;const f=()=>{if(!d){d=1;stop();r()}};p.addEventListener('transitionend',f,{once:true});setTimeout(f,5400)});
  win?(hapticOk(),sfx.upwin()):(haptic('heavy'),sfx.lose());
  busy=false;
  const keep=S.inv[upSrc]?upSrc:null;upSrc=keep;if(win||!keep)upTgt=null;
  const o=win?B:A,r=RAR[o.rar],m2=$('modal');
  m2.innerHTML=`<div class="box" style="--c:${win?'#b9cf8a':'#ed8c79'}"><div class="t">${win?'Апгрейд удался':'Не повезло'}</div><div class="big">${skinArt(o)}</div><div class="n">${o.name}</div><div class="p">${win?'Скин добавлен в инвентарь. Стоимость '+fmt(o.price)+' ◈':'Скин сгорел. Шанс был '+(ch*100).toFixed(1)+'%'}</div><button class="btn good" id="upOk">Продолжить</button></div>`;
  m2.classList.add('show');$('upOk').focus();$('upOk').onclick=()=>{m2.classList.remove('show');render()};
}

/* ---------- инвентарь ---------- */
function sell(key, count){
  const have = S.inv[key]||0, n = Math.min(count, have);
  if (!n) return 0;
  const gain = itemOf(key).price * n;
  S.inv[key] = have - n; if (!S.inv[key]) delete S.inv[key];
  S.balance += gain; save(); renderBal();
  sfx.coin(); toast('Продано за ' + fmt(gain) + ' ◈');
  return gain;
}
function renderInv(){
  const items = Object.entries(S.inv).map(([k,n])=>({...itemOf(k),n})).sort((a,b)=>b.price-a.price||a.name.localeCompare(b.name));
  const total = items.reduce((s,o)=>s+o.price*o.n,0), cnt = items.reduce((s,o)=>s+o.n,0);
  if (!items.length){ $('main').innerHTML=`<h2>Твоя коллекция</h2><p class="page-intro">Все твои находки в одном месте.</p><div class="card empty">${icon('bag')}<h3>Начало чего-то редкого</h3><p class="muted">Здесь появятся предметы из открытых кейсов.<br>Самое время найти первый.</p><button class="btn" onclick="setTab('cases')">Выбрать кейс ↗</button></div>`; return; }
  $('main').innerHTML = `<h2>Твоя коллекция</h2><p class="page-intro">Сохраняй любимое. Продавай лишнее.</p>
    <div class="card"><div class="stat"><span>Предметов</span><b>${cnt}</b></div><div class="stat"><span>Стоимость</span><b>${fmt(total)} ◈</b></div></div>
    <button class="btn sec" id="cheap" style="margin-bottom:12px">Продать всё дешёвое (синие и фиолетовые)</button>` +
    items.map(o=>`<div class="card inv" style="--c:${RAR[o.rar].c}">
      <div class="info"><div class="nm">${o.name}${o.n>1?' ×'+o.n:''}</div><div class="sub">${RAR[o.rar].t} · ${fmt(o.price)} ◈</div></div>
      <div class="acts"><button class="btn sm" data-s="${o.key}">Продать</button>${o.n>1?`<button class="btn sm sec" data-a="${o.key}">Все</button>`:''}</div></div>`).join('');
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ sell(b.dataset.s,1); renderInv(); });
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{ sell(b.dataset.a,999999); renderInv(); });
  $('cheap').onclick = () => {
    let gain=0; Object.keys(S.inv).forEach(k=>{ const o=itemOf(k); if(o.rar==='milspec'||o.rar==='restricted') gain+=sell(k,999999); });
    if(!gain) toast('Дешёвых предметов нет');
    renderInv();
  };
}

/* ---------- профиль ---------- */
function renderMe(){
  const left = S.lastDaily + DAY - Date.now();
  const can = left <= 0;
  const h = Math.floor(left/3600000), m = Math.floor((left%3600000)/60000);
  const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  $('main').innerHTML = `<div class="profile-intro"><div class="avatar">${icon('user')}</div><div><div class="eyebrow">ТВОЙ ПРОФИЛЬ</div><h2>${u ? escapeHTML(u.first_name) : 'Коллекционер'}</h2></div></div>
    <div class="card">
      <button class="btn ${can?'good':'sec'}" id="daily" ${can?'':'disabled'}>${can?`Забрать ежедневный бонус +${DAILY} ◈`:`Бонус через ${h} ч ${m} мин`}</button>
    </div>
    <div class="card">
      <div class="stat"><span>Открыто кейсов</span><b>${S.opened}</b></div>
      <div class="stat"><span>Баланс</span><b>${isAdmin()?'∞':fmt(S.balance)} ◈</b></div><div class="stat"><span>Твой Telegram ID</span><b>${u?u.id:'—'}</b></div>
      <div class="stat"><span>Общее богатство</span><b>${fmt(netWorth())} ◈</b></div>
    </div>
    <div class="card muted">Монеты виртуальные: пополнения и вывода нет. Прогресс сохраняется в этом браузере, а при доступном облаке Telegram — также в аккаунте.</div>
    <button class="btn sec" id="reset">Сбросить прогресс</button>`;
  $('daily').onclick = () => { if(!can) return; S.balance+=DAILY; S.lastDaily=Date.now(); save(); hapticOk(); sfx.coin(); toast('+'+DAILY+' ◈'); render(); };
  $('reset').onclick = () => {
    const doReset = () => { S={ts:0,balance:START_BALANCE,lastDaily:0,inv:{},opened:0}; save(); render(); };
    if (tg && tg.showConfirm) tg.showConfirm('Сбросить весь прогресс?', ok=>{ if(ok) doReset(); });
    else if (confirm('Сбросить весь прогресс?')) doReset();
  };
}

/* ---------- старт ---------- */
(async () => { await load(); setTab('cases'); })();

/* ---------- живой фон ---------- */
(()=>{const o=[0,1,2].map(i=>document.getElementById('o'+i)),still=matchMedia('(prefers-reduced-motion: reduce)').matches;
let tx=innerWidth*.7,ty=innerHeight*.3,x=tx,y=ty,hasP=false;
const mv=e=>{const p=e.touches?e.touches[0]:e;tx=p.clientX;ty=p.clientY;hasP=true};
addEventListener('pointermove',mv,{passive:true});addEventListener('touchmove',mv,{passive:true});
function f(t){t/=1000;if(!hasP){tx=innerWidth*(.5+.3*Math.sin(t*.4));ty=innerHeight*(.4+.25*Math.cos(t*.33))}
x+=(tx-x)*.08;y+=(ty-y)*.08;
o[0].style.transform=`translate(${x}px,${y}px)`;
o[1].style.transform=`translate(${innerWidth*(.2+.15*Math.sin(t*.21))}px,${innerHeight*(.75+.12*Math.cos(t*.27))}px)`;
o[2].style.transform=`translate(${innerWidth*(.85+.1*Math.cos(t*.19))}px,${innerHeight*(.2+.15*Math.sin(t*.23))}px)`;
if(!still)requestAnimationFrame(f)}
requestAnimationFrame(f);})();
</script>
